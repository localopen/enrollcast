# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
    # NB: _pkgdown.yml is deliberately absent — a url or theme change must
    # rebuild. tests/ is present because pkgdown never runs the test suite.
    paths-ignore: # keep in sync with the pull_request list below
      - ".claude/**"
      - ".vscode/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CITATION.cff"
      - ".gitignore"
      - "air.toml"
      - "jarl.toml"
      - "**/*.Rproj"
      - "tests/**"
      - "codecov.yml"
  pull_request:
    paths-ignore: # keep in sync with the push list above
      - ".claude/**"
      - ".vscode/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CITATION.cff"
      - ".gitignore"
      - "air.toml"
      - "jarl.toml"
      - "**/*.Rproj"
      - "tests/**"
      - "codecov.yml"
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # pkgdown renders every root-level *.md that is not on its hardcoded
      # skip list, so AGENTS.md would be published as AGENTS.html and indexed
      # in search.json. Removing it from the ephemeral checkout before the
      # build keeps it out of the pages, the sitemap, and the search index.
      - name: Keep agent instructions out of the site
        run: rm -f AGENTS.md CLAUDE.md

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
